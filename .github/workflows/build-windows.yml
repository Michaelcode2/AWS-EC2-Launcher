name: build-windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      SIGNING_CERT_PFX: ${{ secrets.SIGNING_CERT_PFX }}
      SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Build
        run: powershell -ExecutionPolicy Bypass -File scripts/build-windows.ps1
      - name: Sign
        if: env.SIGNING_CERT_PFX != ''
        run: powershell -ExecutionPolicy Bypass -File scripts/sign-windows.ps1
      - name: Skip signing
        if: env.SIGNING_CERT_PFX == ''
        run: echo "Authenticode secrets are not configured; publishing an unsigned installer for internal use."
      - name: Secret scan (artifacts)
        run: python scripts/check_artifacts.py dist config
      - uses: actions/upload-artifact@v6
        with:
          name: ec2-desktop-manager-installer
          path: dist/installer/*.exe
